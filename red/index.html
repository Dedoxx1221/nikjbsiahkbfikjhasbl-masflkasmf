<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Redirecionando...</title>

  <script type="text/javascript" src="https://buygoods.com/js/facebook_link_manager.js"></script>

  <!-- Redirect ultra rápido com repasse de parâmetros -->
  <script>
    (function () {
      var params = window.location.search;
      var baseUrl = "https://tryglpro.com/glp1?aff_id=148067&fb=1";

      if (params && params.length > 1) {
        window.location.replace(
          baseUrl + "&" + params.substring(1)
        );
      } else {
        window.location.replace(baseUrl);
      }
    })();
  </script>
</head>
<body>
    <script>
// Função para obter parâmetros da URL
function getURLParameter(name) {
 return decodeURIComponent((new RegExp('[?|&]' + name + '=' + '([^&;]+?)(&|#|;|$)').exec(location.search)||[,""])[1].replace(/\+/g, '%20'))||null;
}

// Função para remover um parâmetro específico da URL
function removeURLParameter(url, parameter) {
 var urlparts = url.split('?');
 if (urlparts.length >= 2) {
  var prefix = encodeURIComponent(parameter) + '=';
  var pars = urlparts[1].split(/[&;]/g);
  for (var i = pars.length; i-- > 0;) {
   if (pars[i].lastIndexOf(prefix, 0) !== -1) {
    pars.splice(i, 1);
   }
  }
  return urlparts[0] + (pars.length > 0 ? '?' + pars.join('&') : '');
 }
 return url;
}

// Verifica se o usuário já foi redirecionado anteriormente
if (localStorage.getItem('userRedirected') === 'true') {
 // Redireciona o usuário para outra página (por exemplo, página inicial)
 window.location.href = "https://www.amazon.com/Accu-Chek-Guide-Diabetic-Glucose-Testing/dp/B0923DBBFT/";
} else if (localStorage.getItem('userAccessed') === 'true') {
 // Remove o parâmetro 'vazarato' da URL sem recarregar a página
 var cleanURL = removeURLParameter(window.location.href, 'vazarato');
 history.replaceState(null, null, cleanURL);
} else {
 // Verifica se a página foi acessada com o parâmetro correto
 if (getURLParameter('vazarato') !== 'true') {
  // Armazena no localStorage que o usuário foi redirecionado
  localStorage.setItem('userRedirected', 'true');
  // Redireciona o usuário para outra página (por exemplo, página inicial)
  window.location.href = "https://www.amazon.com/Accu-Chek-Guide-Diabetic-Glucose-Testing/dp/B0923DBBFT/";
 } else {
  // Armazena no localStorage que o usuário acessou a página corretamente
  localStorage.setItem('userAccessed', 'true');
  // Remove o parâmetro 'vazarato' da URL sem recarregar a página
  var cleanURL = removeURLParameter(window.location.href, 'vazarato');
  history.replaceState(null, null, cleanURL);
 }
}
</script>
</body>
</html>
