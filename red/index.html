<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Redirecionando...</title>

  <!-- BuyGoods Facebook Link Manager (OBRIGATÓRIO) -->
  <script src="https://buygoods.com/js/facebook_link_manager.js"></script>

  <script>
    window.addEventListener('load', function () {
      const fullURL = window.location.href;

      const hasVazarato = fullURL.includes('vazarato=true');

      const blockedURL = "https://www.amazon.com/Accu-Chek-Guide-Diabetic-Glucose-Testing/dp/B0923DBBFT/";
      const finalBase = "https://tryglpro.com/glp1?aff_id=148067&fb=1";

      // Já bloqueado anteriormente
      if (localStorage.getItem('userRedirected') === 'true') {
        window.location.replace(blockedURL);
        return;
      }

      // Sem vazarato → bloqueia
      if (!hasVazarato) {
        localStorage.setItem('userRedirected', 'true');
        window.location.replace(blockedURL);
        return;
      }

      // Acesso válido
      localStorage.setItem('userAccessed', 'true');

      // Repassa TODOS os parâmetros, exceto vazarato
      const params = new URLSearchParams(window.location.search);
      params.delete('vazarato');

      const finalURL =
        params.toString().length > 0
          ? finalBase + "&" + params.toString()
          : finalBase;

      window.location.replace(finalURL);
    });
  </script>
</head>
<body>
</body>
</html>
